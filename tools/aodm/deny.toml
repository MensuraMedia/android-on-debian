# cargo-deny policy (run by `adx check`): advisories, licences, sources, bans.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]   # only what the tree uses; adding one needs a reason
# Per-crate exceptions for the aod-gui window (eframe), not allowed tree-wide:
exceptions = [
    # Fonts egui embeds; free to embed and redistribute with software.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    { crate = "libloading", allow = ["ISC"] },   # permissive
    { crate = "foldhash", allow = ["Zlib"] },    # permissive
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[workspace]
resolver = "3"
members = ["crates/aod-core", "crates/aodm"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/MensuraMedia/android-on-debian"

# Every dependency needs a reason in docs/dependencies.md §5. Keep this list short.
[workspace.dependencies]
aod-core = { path = "crates/aod-core" }
anyhow = "1.0.104"
clap_complete = "4.6.11"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = "0.2.39"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

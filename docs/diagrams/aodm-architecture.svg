<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aodm-architecture-title aodm-architecture-desc" id="aodm-architecture-root">
        <title id="aodm-architecture-title">aodm phone image manager architecture</title>
        <desc id="aodm-architecture-desc">The user or Claude Code drives the aodm CLI/TUI and the standalone aod-phone runtime, both built on the aod-core library, which spawns emulators and talks to adb, the SDK tools and the images, saves and logs on disk; the adx framework builds and installs the binaries.</desc>
        <defs>
      <style>#aodm-architecture-root { --color-paper:   #14181f;
      --color-ink:     #e6ebf0;
      --color-muted:   #a3afbc;
      --color-accent:  #4fd1a5;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #aodm-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #aodm-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#aodm-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="aodm-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3afbc"/></marker>
          <marker id="aodm-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4fd1a5"/></marker>
          <marker id="aodm-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7f0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#14181f"/>

        <!-- Zones (bg → zones → arrows → nodes) -->
        <rect x="376" y="176" width="528" height="256" rx="8" fill="#e6ebf0" stroke="#e6ebf0" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="392" y="180" width="168" height="12" rx="2" fill="#14181f"/>
        <text x="476" y="189" fill="#8e9aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RUST WORKSPACE · TOOLS/AODM</text>

        <rect x="96" y="472" width="1088" height="112" rx="8" fill="#e6ebf0" stroke="#e6ebf0" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="112" y="476" width="132" height="12" rx="2" fill="#14181f"/>
        <text x="178" y="485" fill="#8e9aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">HOST · ANDROID SDK</text>


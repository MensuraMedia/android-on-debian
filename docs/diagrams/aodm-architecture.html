<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aodm: phone image manager architecture</title>
  <!-- Profile aod-flat-dark: font source system (no web font request). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #14181f;
      --color-ink:     #e6ebf0;
      --color-muted:   #a3afbc;
      --color-accent:  #4fd1a5;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · android-on-debian</p>
    <h1>aodm: the phone image manager</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aodm-architecture-title aodm-architecture-desc">
        <title id="aodm-architecture-title">aodm phone image manager architecture</title>
        <desc id="aodm-architecture-desc">The user or Claude Code drives the aodm CLI/TUI and the standalone aod-phone runtime, both built on the aod-core library, which spawns emulators and talks to adb, the SDK tools and the images, saves and logs on disk; the adx framework builds and installs the binaries.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3afbc"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4fd1a5"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7f0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#14181f"/>

        <!-- Zones (bg → zones → arrows → nodes) -->
        <rect x="376" y="176" width="528" height="256" rx="8" fill="rgba(230,235,240,0.02)" stroke="rgba(230,235,240,0.10)" stroke-width="0.8"/>
        <rect x="392" y="180" width="168" height="12" rx="2" fill="#14181f"/>
        <text x="476" y="189" fill="#8e9aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RUST WORKSPACE · TOOLS/AODM</text>

        <rect x="96" y="472" width="1088" height="112" rx="8" fill="rgba(230,235,240,0.02)" stroke="rgba(230,235,240,0.10)" stroke-width="0.8"/>
        <rect x="112" y="476" width="132" height="12" rx="2" fill="#14181f"/>
        <text x="178" y="485" fill="#8e9aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">HOST · ANDROID SDK</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- operator → aodm -->
        <line x1="560" y1="128" x2="560" y2="206" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="568" y="152" width="28" height="12" rx="2" fill="#14181f"/>
        <text x="582" y="161" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>
        <!-- operator → aod-phone -->
        <line x1="720" y1="128" x2="720" y2="206" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="728" y="152" width="56" height="12" rx="2" fill="#14181f"/>
        <text x="756" y="161" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONTROL</text>
        <!-- adx → aodm (build-time, dashed) -->
        <line x1="320" y1="236" x2="398" y2="236" stroke="#a3afbc" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="332" y="218" width="56" height="12" rx="2" fill="#14181f"/>
        <text x="360" y="227" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BUILDS</text>
        <!-- aodm → aod-core -->
        <line x1="510" y1="264" x2="510" y2="342" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- aod-phone → aod-core -->
        <line x1="770" y1="264" x2="770" y2="342" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- aod-core → emulators: left edge, then down -->
        <path d="M 400,376 H 248 Q 240,376 240,384 V 502" fill="none" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="300" y="356" width="40" height="12" rx="2" fill="#14181f"/>
        <text x="320" y="365" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN</text>
        <!-- aod-core → adb -->
        <line x1="500" y1="408" x2="500" y2="502" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="508" y="450" width="28" height="12" rx="2" fill="#14181f"/>
        <text x="522" y="459" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADB</text>
        <!-- aod-core → SDK tools -->
        <line x1="740" y1="408" x2="740" y2="502" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="748" y="450" width="48" height="12" rx="2" fill="#14181f"/>
        <text x="772" y="459" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>

        <path d="M 880,376 H 1012 Q 1020,376 1020,384 V 502" fill="none" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="904" y="356" width="80" height="12" rx="2" fill="#14181f"/>
        <text x="944" y="365" fill="#8e9aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVE · LOG</text>
        <!-- adb → emulators -->
        <line x1="400" y1="532" x2="362" y2="532" stroke="#a3afbc" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <!-- 1. Operator (input) -->
        <rect x="520" y="72" width="240" height="56" rx="6" fill="#14181f"/>
        <rect x="520" y="72" width="240" height="56" rx="6" fill="rgba(163,175,188,0.10)" stroke="#8e9aa8" stroke-width="1"/>
        <rect x="528" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(142,154,168,0.40)" stroke-width="0.8"/>
        <text x="544" y="87" fill="#8e9aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="640" y="104" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You · Claude Code</text>
        <text x="640" y="118" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">terminal · scripts · mobile-mcp</text>

        <!-- 2. adx framework (external) -->
        <rect x="80" y="208" width="240" height="56" rx="6" fill="#14181f"/>

        <rect x="88" y="214" width="32" height="12" rx="2" fill="transparent" stroke="rgba(230,235,240,0.22)" stroke-width="0.8"/>

        <text x="200" y="240" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">adx framework</text>
        <text x="200" y="254" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rust · devices · devtools</text>

        <!-- 3. aodm (backend) -->
        <rect x="400" y="208" width="220" height="56" rx="6" fill="#14181f"/>
        <rect x="400" y="208" width="220" height="56" rx="6" fill="#1c222b" stroke="#e6ebf0" stroke-width="1"/>
        <rect x="408" y="214" width="28" height="12" rx="2" fill="transparent" stroke="rgba(230,235,240,0.40)" stroke-width="0.8"/>
        <text x="422" y="223" fill="#e6ebf0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
        <text x="510" y="240" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">aodm</text>
        <text x="510" y="254" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">clap CLI · ratatui TUI</text>

        <!-- 4. aod-phone (backend) -->
        <rect x="660" y="208" width="220" height="56" rx="6" fill="#14181f"/>
        <rect x="660" y="208" width="220" height="56" rx="6" fill="#1c222b" stroke="#e6ebf0" stroke-width="1"/>
        <rect x="668" y="214" width="28" height="12" rx="2" fill="transparent" stroke="rgba(230,235,240,0.40)" stroke-width="0.8"/>
        <text x="682" y="223" fill="#e6ebf0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
        <text x="770" y="240" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">aod-phone</text>
        <text x="770" y="254" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">standalone phone · mechanics</text>

        <!-- 5. aod-core (focal) -->
        <rect x="400" y="344" width="480" height="64" rx="6" fill="#14181f"/>
        <rect x="400" y="344" width="480" height="64" rx="6" fill="rgba(79,209,165,0.10)" stroke="#4fd1a5" stroke-width="1.2"/>
        <rect x="408" y="350" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,209,165,0.50)" stroke-width="0.8"/>
        <text x="422" y="359" fill="#4fd1a5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="640" y="380" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">aod-core library</text>
        <text x="640" y="396" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">saves · templates · identity · settings · spinoff · card</text>

        <!-- 6. Emulators (external) -->
        <rect x="120" y="504" width="240" height="56" rx="6" fill="#14181f"/>

        <text x="240" y="536" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Android emulators</text>
        <text x="240" y="550" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">qemu + KVM · :5554+2n</text>

        <!-- 7. adb server (external) -->
        <rect x="400" y="504" width="200" height="56" rx="6" fill="#14181f"/>
        <rect x="400" y="504" width="200" height="56" rx="6" fill="rgba(230,235,240,0.03)" stroke="rgba(230,235,240,0.30)" stroke-width="1"/>
        <rect x="408" y="510" width="28" height="12" rx="2" fill="transparent" stroke="rgba(230,235,240,0.22)" stroke-width="0.8"/>
        <text x="422" y="519" fill="#a3afbc" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ADB</text>
        <text x="500" y="536" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">adb server</text>
        <text x="500" y="550" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:5037</text>

        <!-- 8. SDK tools (external) -->
        <rect x="640" y="504" width="200" height="56" rx="6" fill="#14181f"/>
        <rect x="640" y="504" width="200" height="56" rx="6" fill="rgba(230,235,240,0.03)" stroke="rgba(230,235,240,0.30)" stroke-width="1"/>

        <text x="662" y="519" fill="#a3afbc" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
        <text x="740" y="536" fill="#e6ebf0" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SDK tools</text>
        <text x="740" y="550" fill="#a3afbc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">avdmanager · sdkmanager</text>

        <!-- 9. State on disk (store) -->
        <rect x="880" y="504" width="280" height="56" rx="6" fill="#14181f"/>
        <rect x="880" y="504" width="280" height="56" rx="6" fill="rgba(230,235,240,0.05)" stroke="#a3afbc" stroke-width="1"/>
        <rect x="888" y="510" width="32" height="12" rx="2" fill="transparent" stroke="rgba(163,175,188,0.40)" stroke-width="0.8"/>
        <text x="904" y="519" fill="#a3afbc" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>

        <!-- Legend strip -->
        <line x1="30" y1="632" x2="1250" y2="632" stroke="rgba(230,235,240,0.10)" stroke-width="0.8"/>

    </div>
  </div>
</body>
</html>
